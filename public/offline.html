<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF6B35" />
    <title>CampusEats — Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #fafaf8;
        color: #1a1a1a;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #6b7280;
        font-size: 0.95rem;
        max-width: 22rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.65rem 1.25rem;
        background: #ff6b35;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You are offline</h1>
      <p>
        Check your connection and try again. CampusEats needs the network for
        menus, orders, and payments.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
